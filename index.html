<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; style-src 'unsafe-inline' https://cdn.jsdelivr.net; font-src https://cdn.jsdelivr.net; img-src 'self' data:; connect-src https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#cfe6ff">
<title>Memo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232f5bff'/%3E%3Cpath d='M10 9h9l4 4v10H10z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg1:#dcefff; --bg2:#a9d1fb;
  --panel:#fff; --side:#f5f7fa;
  --ink:#1c2230; --ink2:#4b5567; --muted:#8d96a6; --line:#e8ebf1;
  --primary:#2f5bff; --primary-d:#2347d4; --primary-soft:#e8eeff; --primary-line:#cddbff;
  --danger:#e5484d;
  --shadow:0 30px 70px -28px rgba(30,70,140,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color:var(--ink);
  background:linear-gradient(135deg,var(--bg1),var(--bg2)) fixed;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{opacity:.38;cursor:not-allowed}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.icon.sm{width:14px;height:14px}
.grow{flex:1}

/* ---------- shell ---------- */
#app{height:100dvh;padding:clamp(0px,2.4vw,28px);display:flex;justify-content:center}
.shell{
  width:100%;max-width:1320px;background:var(--panel);border-radius:22px;box-shadow:var(--shadow);
  overflow:hidden;display:grid;grid-template-columns:236px 330px minmax(0,1fr);position:relative;
}

/* ---------- sidebar ---------- */
.side{background:var(--side);border-right:1px solid var(--line);padding:22px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:4px;overflow:auto;min-height:0}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15.5px;padding:4px 8px 18px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#5b82ff,#2f5bff);color:#fff;display:grid;place-items:center}
.btn-new{height:42px;border-radius:12px;background:var(--primary);color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 10px 20px -10px rgba(47,91,255,.8);margin-bottom:16px}
.btn-new:hover{background:var(--primary-d)}
.nav-label{font-size:11px;color:var(--muted);font-weight:600;padding:14px 10px 6px}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:12px;color:var(--ink2);font-size:12.5px;text-align:left}
.nav:hover{background:rgba(20,30,60,.05)}
.nav.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(20,30,60,.08)}
.nav .cnt{margin-left:auto;color:var(--muted);font-size:11px}
.nav .cnt.live{color:#1f9d57;font-weight:600}
.side-foot{margin-top:auto;padding:14px 10px 0;font-size:11px;line-height:1.55;color:var(--muted)}

/* ---------- list ---------- */
.list{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--line);background:#fff}
.list-head{padding:20px 18px 8px}
.list-row{display:flex;align-items:center;gap:6px;margin-bottom:14px}
.list-row h2{margin:0;font-size:18px;font-weight:700}
.menu-btn,.fab{display:none}
.search{position:relative}
.search .icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--side);padding:0 14px 0 38px;font:inherit;font-size:13.5px;outline:0}
.search input:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(47,91,255,.12)}
.cards{flex:1;overflow:auto;padding:8px 14px 18px;display:grid;gap:10px;align-content:start;-webkit-overflow-scrolling:touch}
.card{display:block;width:100%;text-align:left;background:var(--side);border:1px solid transparent;border-radius:14px;padding:14px 16px}
.card:hover{border-color:var(--line);background:#f0f3f8}
.card.on{background:linear-gradient(135deg,#e6efff,#d0e1ff);border-color:var(--primary-line)}
.c-top{display:flex;align-items:center;gap:8px}
.c-title{flex:1;min-width:0;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-top .icon{color:var(--primary)}
.c-top time{font-size:11px;color:var(--muted);flex:none}
.c-prev{margin-top:6px;font-size:11px;line-height:1.5;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.none{text-align:center;color:var(--muted);padding:48px 12px;font-size:12px;line-height:1.7}

/* ---------- editor ---------- */
.editor{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative;background:#fff}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);text-align:center;padding:24px}
.empty .ring{width:64px;height:64px;border-radius:20px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;margin-bottom:6px}
.empty .ring .icon{width:28px;height:28px}
.empty p{margin:0;font-size:12.5px}
.ed{display:flex;flex-direction:column;flex:1;min-height:0}
.ed-top{display:flex;align-items:center;gap:4px;padding:14px 18px 4px}
.back{display:none}
.fmt{display:flex;gap:4px}
.fbtn{width:32px;height:32px;border-radius:9px;color:var(--muted);font-size:13px;display:grid;place-items:center}
.fbtn:hover{background:#f1f4f9}
.fbtn.on{background:var(--primary-soft);color:var(--primary)}
.ibtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#5b6577}
.ibtn:hover:not(:disabled){background:#f1f4f9}
.ibtn.on{color:var(--primary);background:var(--primary-soft)}
.ibtn.del:hover:not(:disabled){color:var(--danger);background:#fdeeee}
.save{height:32px;padding:0 18px;border-radius:999px;border:1px solid var(--primary-line);color:var(--primary);font-weight:600;font-size:12px;background:#fff;margin-left:4px;transition:background .15s,color .15s}
.save:hover:not(:disabled){background:var(--primary-soft)}
.save.ok{background:var(--primary);border-color:var(--primary);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 18px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:#f3f6fb;border:1px solid var(--line);font-size:11.5px;font-weight:500;color:#3d4657}
.chip:hover:not(:disabled){background:var(--primary-soft);border-color:var(--primary-line);color:var(--primary)}
.chip small{font-size:11px;background:var(--primary);color:#fff;border-radius:999px;padding:1px 6px;font-weight:600}
.ed-main{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow:auto;padding:6px 26px 24px;-webkit-overflow-scrolling:touch}
.title{width:100%;border:0;outline:0;font:inherit;font-size:22px;font-weight:700;padding:10px 0 12px;color:var(--ink);background:transparent;border-radius:0}
.title::placeholder{color:#c3c9d4}
.body{outline:0;min-height:50vh;font-size:13.5px;line-height:1.85;color:#5d6678;word-break:break-word;white-space:pre-wrap}
.body b,.body strong{color:var(--ink)}
.body:empty::before{content:attr(data-placeholder);color:#b9c0cd;pointer-events:none}
.ed-foot{display:flex;align-items:center;gap:10px;padding:12px 22px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #f0f2f6;color:var(--muted);font-size:11px}
.avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#ffc08f,#ff7aa2);flex:none}
.lockscreen{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;z-index:3}
.lockscreen .ring{width:64px;height:64px;border-radius:20px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center}
.lockscreen .ring .icon{width:28px;height:28px}
.lockscreen h3{margin:6px 0 0;font-size:15.5px}
.lockscreen p{margin:0;color:var(--muted);font-size:12px}
.lockscreen .in{max-width:280px;text-align:center}
.err{color:var(--danger);font-size:11.5px;min-height:1.2em;margin:0}

/* ---------- sheet (panels) ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,30,50,.38);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.dscrim{position:fixed;inset:0;background:rgba(20,30,50,.38);opacity:0;pointer-events:none;transition:opacity .2s;z-index:29}
.sheet{
  position:fixed;z-index:50;background:#fff;display:flex;flex-direction:column;
  left:0;right:0;bottom:0;max-height:84dvh;border-radius:22px 22px 0 0;
  box-shadow:0 -20px 50px -20px rgba(20,40,90,.4);
  transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
}
.sheet.on{transform:none}
.sheet-head{display:flex;align-items:center;padding:18px 18px 8px 22px}
.sheet-head h3{margin:0;font-size:14.5px;flex:1}
.sheet-body{overflow:auto;padding:6px 22px calc(26px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.hint{margin:0 0 14px;color:var(--muted);font-size:11.5px;line-height:1.6}
.fl{display:block;font-size:11px;font-weight:600;color:var(--ink2);margin:12px 0 6px}
.in{width:100%;height:40px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font:inherit;font-size:13.5px;background:#f7f9fc;outline:0;color:var(--ink)}
.in:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(47,91,255,.12)}
textarea.in{height:auto;padding:12px 14px;min-height:86px;resize:vertical;line-height:1.6}
.btn-primary{height:40px;border-radius:12px;background:var(--primary);color:#fff;font-weight:600;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary:hover:not(:disabled){background:var(--primary-d)}
.btn-ghost{height:38px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:0 16px;font-weight:500;font-size:12.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-ghost:hover:not(:disabled){background:#f4f6fa}
.btn-danger{color:var(--danger)}
.block{display:flex;width:100%;margin-top:10px}
.row{display:flex;gap:8px;margin-top:10px}
.box{border:1px solid var(--line);background:#fafbfd;border-radius:16px;padding:4px 16px 16px;margin-bottom:6px}
.sec{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:600;color:var(--muted);margin:18px 0 8px}
.link{color:var(--primary);font-weight:600;font-size:11px}
.note{font-size:11px;color:var(--muted);line-height:1.6;margin:12px 0 0}
.rp-count{margin:12px 0 2px;font-size:12px;color:var(--ink2)}
.rp-count b{color:var(--primary)}
kbd{display:inline-block;min-width:24px;padding:3px 7px;margin-right:4px;border-radius:7px;background:#fff;border:1px solid #d9deea;border-bottom-width:2px;font-weight:600;font-size:11px;color:#46506a;text-align:center}
.nokey{font-size:11px;color:var(--muted)}

.clip{border:1px solid var(--line);border-radius:14px;padding:12px 14px 8px;margin-bottom:10px;background:#fafbfd}
.clip.pinned{background:#f1f5ff;border-color:var(--primary-line)}
.clip-text{white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.55;max-height:6.4em;overflow:hidden;color:#2b3345}
.clip-act{display:flex;align-items:center;gap:2px;margin-top:8px}
.clip-time{font-size:11px;color:var(--muted)}
.clip-act button{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;color:#6b7589}
.clip-act button:hover{background:#e9eefb}
.clip-act button.on{color:var(--primary)}
.clip-act button.on svg{fill:currentColor}

.snip{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:#fafbfd;overflow:hidden}
.snip-main{flex:1;min-width:0;padding:12px 14px;cursor:pointer}
.snip-main:hover{background:#f1f5ff}
.snip-text{margin-top:8px;font-size:12px;line-height:1.5;color:#2b3345;white-space:pre-wrap;word-break:break-word;max-height:4.6em;overflow:hidden}
.snip-act{display:flex;flex-direction:column;justify-content:center;border-left:1px solid var(--line)}
.snip-act button{width:40px;height:40px;display:grid;place-items:center;color:#6b7589}
.snip-act button:hover{background:#e9eefb}

.sp{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.sp-main{flex:1;min-width:0}
.sp-fix{font-size:13px;font-weight:600}
.sp-fix del{color:var(--danger);text-decoration-thickness:1.5px}
.sp-fix ins{color:var(--primary);text-decoration:none}
.sp-note{font-size:11px;color:var(--muted);margin-top:3px}
.sp .btn-ghost{height:32px;padding:0 14px;font-size:11.5px}
.okbox{display:flex;align-items:center;gap:10px;padding:18px;border-radius:14px;background:#effaf3;color:#1f7a45;font-weight:500}
.out{margin-top:14px}
.out .in{font-size:11px}

.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:#1c2230;color:#fff;padding:11px 18px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- trash ---------- */
.tr-head{position:sticky;top:0;z-index:2;background:#fff;display:flow-root;padding-bottom:8px}
.tr-head .sec{margin:6px 0 8px}
.tr-empty{color:var(--danger)}
.tr-bar{display:flex;align-items:center;gap:6px}
.tr-bar .btn-ghost{height:34px;padding:0 12px;font-size:12px}
.tr-all{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 4px;border-radius:10px;font-size:12px;font-weight:500;color:var(--ink2)}
.tr-all:hover{background:#f4f6fa}
.tr-chk{width:20px;height:20px;border-radius:7px;border:1.5px solid #c9d0de;background:#fff;color:#fff;display:grid;place-items:center;flex:none;transition:background .12s,border-color .12s}
.tr-chk .icon{width:13px;height:13px;stroke-width:2.6;opacity:0}
.tr-all.on .tr-chk,.tr-item.on .tr-chk{background:var(--primary);border-color:var(--primary)}
.tr-all.on .tr-chk .icon,.tr-item.on .tr-chk .icon{opacity:1}
.tr-item{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:#fafbfd;overflow:hidden}
.tr-item.on{background:#f1f5ff;border-color:var(--primary-line)}
.tr-sel{flex:1;min-width:0;display:flex;align-items:flex-start;gap:12px;padding:12px 8px 12px 14px;text-align:left}
.tr-sel .tr-chk{margin-top:1px}
.tr-main{flex:1;min-width:0;display:block}
.tr-title{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px}
.tr-title .icon{color:var(--primary)}
.tr-t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr-prev{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:4px;font-size:11px;line-height:1.5;color:var(--muted);word-break:break-word}
.tr-meta{display:block;margin-top:6px;font-size:10.5px;color:#a0a8b8}
.tr-restore{width:44px;flex:none;display:grid;place-items:center;border-left:1px solid var(--line);color:#6b7589}
.tr-restore:hover{background:#e9eefb;color:var(--primary)}
.tr-sel:focus-visible,.tr-restore:focus-visible{outline-offset:-3px}

/* ---------- shared viewer ---------- */
#viewer{height:100dvh;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:clamp(12px,4vw,44px)}
.v-card{width:100%;max-width:760px;background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:26px clamp(20px,4vw,40px) 30px}
.v-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--primary);background:var(--primary-soft);border-radius:999px;padding:5px 12px;margin-bottom:12px}
.v-card h1{margin:4px 0 14px;font-size:23px;line-height:1.35;word-break:break-word}
.v-lock{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:36px 0 18px}
.v-lock .ring{width:64px;height:64px;border-radius:20px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center}
.v-lock .ring .icon{width:28px;height:28px}
.v-lock h3{margin:6px 0 0;font-size:15.5px}
.v-lock p{margin:0;color:var(--muted);font-size:12px}
.v-lock .in{max-width:300px;text-align:center}
.v-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:26px;padding-top:18px;border-top:1px solid #f0f2f6}

/* ---------- responsive ---------- */
@media (min-width:1000px){
  .sheet{left:auto;right:28px;top:28px;bottom:28px;width:390px;max-height:none;border-radius:20px;box-shadow:0 30px 70px -20px rgba(20,40,90,.45);transform:translateX(calc(100% + 40px))}
  .scrim.on{background:rgba(20,30,50,.1)}
}
@media (max-width:999px){
  .shell{grid-template-columns:330px minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:276px;transform:translateX(-104%);transition:transform .26s cubic-bezier(.2,.8,.2,1);z-index:30;box-shadow:20px 0 50px -20px rgba(20,40,90,.4)}
  body.drawer .side{transform:none}
  body.drawer .dscrim{opacity:1;pointer-events:auto}
  .menu-btn{display:grid}
  .fab{display:grid;width:38px;height:38px;border-radius:50%;background:var(--primary);color:#fff;place-items:center;box-shadow:0 8px 16px -8px rgba(47,91,255,.8)}
}
@media (max-width:699px){
  #app{padding:0}
  .shell{border-radius:0;grid-template-columns:minmax(0,1fr);box-shadow:none}
  .shell[data-view="list"] .editor{display:none}
  .shell[data-view="editor"] .list{display:none}
  .back{display:grid}
  .ed-top{padding:calc(10px + env(safe-area-inset-top)) 10px 2px 8px}
  .list-head{padding:calc(16px + env(safe-area-inset-top)) 16px 8px}
  .chips{padding:8px 12px 10px}
  .scroll{padding:4px 18px 20px}
  .title{font-size:20.5px}
  .ibtn{width:34px}
  .save{padding:0 14px;margin-left:2px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- ================= APP ================= -->
<div id="app">
  <div class="shell" id="shell" data-view="list">

    <aside class="side" id="side">
      <div class="brand"><span class="logo"><i data-i="note"></i></span>Memo</div>
      <button class="btn-new" id="btnNew"><i data-i="plus"></i>새 메모</button>

      <div class="nav-label">메모</div>
      <button class="nav on" data-filter="all"><i data-i="note"></i>모든 메모<span class="cnt" id="cntAll">0</span></button>
      <button class="nav" data-filter="locked"><i data-i="lock"></i>잠긴 메모<span class="cnt" id="cntLocked">0</span></button>
      <button class="nav" id="navTrash"><i data-i="trash"></i>휴지통<span class="cnt" id="cntTrash">0</span></button>

      <div class="nav-label">도구</div>
      <button class="nav" id="navClip"><i data-i="clipboard"></i>클립보드<span class="cnt" id="cntClip">0</span></button>
      <button class="nav" id="navSnip"><i data-i="keyboard"></i>단축 문구<span class="cnt" id="cntSnip">0</span></button>
      <button class="nav" id="navSync"><i data-i="cloud"></i>동기화<span class="cnt" id="cntSync">꺼짐</span></button>

<script>
(() => {
'use strict';

/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const enc = new TextEncoder(), dec = new TextDecoder();
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

const P = {
  plus:'<path d="M12 5v14M5 12h14"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  note:'<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>',
  lock:'<rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
  unlock:'<rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 7.5-2"/>',
  clipboard:'<rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 4.5h6V7H9zM9 12h6M9 16h4"/>',
  keyboard:'<rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6.5 10h.01M10 10h.01M14 10h.01M17.5 10h.01M7.5 14h9"/>',
  replace:'<path d="M4 8h13l-3.5-3.5M20 16H7l3.5 3.5"/>',
  spell:'<circle cx="12" cy="12" r="9"/><path d="m8 12.3 2.8 2.8L16.2 9.5"/>',
  link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 10 18.7l1-1"/>',
  pin:'<path d="M12 16.5V22M8.5 3h7l-1 6 3 3.2v1.8h-11v-1.8L9.5 9z"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  copy:'<rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H16"/>',
  paste:'<path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14"/>',
  back:'<path d="m15 5-7 7 7 7"/>',
  menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  cloud:'<path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 10.5a3.8 3.8 0 0 1-.5 7.5z"/>',
  send:'<path d="M12 4v11M7.5 8.5 12 4l4.5 4.5M5 14v5.5h14V14"/>',
  restore:'<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>'
};
const ic = (n, c = '') => `<svg class="icon ${c}" viewBox="0 0 24 24" aria-hidden="true">${P[n] || ''}</svg>`;
$$('[data-i]').forEach(el => { el.outerHTML = ic(el.dataset.i); });

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  has(k) { try { return localStorage.getItem(k) !== null; } catch { return false; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { toast('저장 공간이 부족해서 저장하지 못했어요'); return false; } }
};

let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200);
}

function fmtTime(ts) {
  const d = Date.now() - ts;
  if (d < 60e3) return '방금 전';
  if (d < 3600e3) return Math.floor(d / 60e3) + '분 전';
  if (d < 86400e3) return Math.floor(d / 3600e3) + '시간 전';
  const dt = new Date(ts);
  return (dt.getMonth() + 1) + '월 ' + dt.getDate() + '일';
}

/* ---- bytes / base64url ---- */
const b64 = u8 => {
  let s = ''; const CH = 0x8000;
  for (let i = 0; i < u8.length; i += CH) s += String.fromCharCode.apply(null, u8.subarray(i, i + CH));
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
};
const unb64 = t => {
  t = t.replace(/-/g, '+').replace(/_/g, '/'); while (t.length % 4) t += '=';
  const s = atob(t), u = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
  return u;
};
const cat = (...a) => {
  const o = new Uint8Array(a.reduce((n, x) => n + x.length, 0)); let p = 0;
  a.forEach(x => { o.set(x, p); p += x.length; }); return o;
};

/* ================= crypto (AES-GCM + PBKDF2) ================= */
const ITER = 250000;
async function deriveKey(pw, salt) {
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: ITER, hash: 'SHA-256' }, base,
    { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function aesEnc(key, bytes) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, bytes));
  return cat(iv, ct);
}
async function aesDec(key, data) {
  return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: data.slice(0, 12) }, key, data.slice(12)));
}
async function pipe(bytes, stream) {
  const w = stream.writable.getWriter(); w.write(bytes); w.close();
  return new Uint8Array(await new Response(stream.readable).arrayBuffer());
}
const deflate = async b => ('CompressionStream' in window) ? pipe(b, new CompressionStream('deflate-raw')) : null;
const inflate = async b => {
  if (!('DecompressionStream' in window)) throw new Error('nosupport');
  return pipe(b, new DecompressionStream('deflate-raw'));
};

/* ================= sanitizer (whitelist) ================= */
const ALLOWED = new Set(['B', 'STRONG', 'I', 'EM', 'U', 'DIV', 'P', 'BR']);
function sanitize(html) {
  const doc = new DOMParser().parseFromString(String(html || ''), 'text/html');
  const out = document.createElement('div');
  (function walk(src, dst) {
    for (const n of src.childNodes) {
      if (n.nodeType === 3) dst.appendChild(document.createTextNode(n.nodeValue));
      else if (n.nodeType === 1) {
        const t = n.tagName;
        if (t === 'SCRIPT' || t === 'STYLE' || t === 'TEMPLATE') continue;
        if (ALLOWED.has(t)) { const el = document.createElement(t.toLowerCase()); walk(n, el); dst.appendChild(el); }
        else walk(n, dst);
      }
    }
  })(doc.body, out);
  return out.innerHTML;
}
const plain = html => {
  const d = new DOMParser().parseFromString(String(html || '').replace(/<(br|\/div|\/p)\s*\/?>/gi, ' '), 'text/html');
  return (d.body.textContent || '').replace(/\s+/g, ' ').trim();
};

/* ================= state ================= */
const K = { memos: 'memo.v1.memos', snips: 'memo.v1.snips', clips: 'memo.v1.clips', snipsAt: 'memo.v1.snipsAt' };
const MAX_CLIPS = 15;
const WELCOME = '<b>Memo에 오신 것을 환영해요</b><br><br>• 입력하면 자동으로 저장돼요.<br>• 위쪽 자물쇠로 이 메모에 비밀번호를 걸 수 있어요.<br>• 링크 버튼으로 공유 링크를 만들어 보내세요. 비밀번호를 걸면 링크 안의 내용도 암호화돼요.<br>• 단축 문구에서 Alt+1 같은 단축키를 지정하면 자주 쓰는 문구를 바로 넣을 수 있어요.<br>• 단어를 드래그한 뒤 "일괄 바꾸기"를 누르면 같은 단어를 한 번에 바꿀 수 있어요.<br>• 복사하거나 잘라낸 내용은 클립보드에 최근 15개까지 남고, 핀으로 고정하면 계속 남아요.';

const firstRun = !store.has(K.memos);
let memos = store.get(K.memos, []);
if (firstRun) { memos = [{ id: uid(), title: '시작하기', html: WELCOME, updated: Date.now(), lock: null, welcome: true }]; store.set(K.memos, memos); }
let snips = store.get(K.snips, [
  { id: 's1', key: 'Alt+1', text: '안녕하세요. 잘 부탁드립니다.' },
  { id: 's2', key: 'Alt+2', text: '감사합니다.' }
]);
let clips = store.get(K.clips, []);
let snipsAt = store.get(K.snipsAt, 0);
let curId = null, filter = 'all', query = '';
const sessions = {};          // memoId -> { key, salt } (메모리에만 보관)
let savedRange = null, undoSnap = null;
let dirty = false, saveTimer = null, saveChain = Promise.resolve();
let suppressClip = false, mode = 'app';

const shell = $('#shell'), cardsEl = $('#cards'), titleEl = $('#title'), bodyEl = $('#body');
const edEl = $('#ed'), emptyEl = $('#emptyState'), lockScreen = $('#lockScreen');
const mqDesktop = matchMedia('(min-width:700px)');
const isMobile = () => !mqDesktop.matches;
const cur = () => memos.find(m => m.id === curId);
const editable = () => { const m = cur(); return !!m && !edEl.hidden && (!m.lock || !!sessions[m.id]); };

/* ================= list ================= */
function renderList() {
  const q = query.trim().toLowerCase();
  let arr = [...memos].sort((a, b) => b.updated - a.updated);
  $('#cntAll').textContent = memos.length;
  $('#cntLocked').textContent = memos.filter(m => m.lock).length;
  $('#cntSnip').textContent = snips.length;
  $('#cntClip').textContent = clips.length;
  const n = clips.length; const cn = $('#chClipN'); cn.hidden = !n; cn.textContent = n;
  if (filter === 'locked') arr = arr.filter(m => m.lock);
  if (q) arr = arr.filter(m => (m.title || '').toLowerCase().includes(q) || (!m.lock && plain(m.html).toLowerCase().includes(q)));
  cardsEl.innerHTML = arr.length ? arr.map(m => `
    <button class="card${m.id === curId ? ' on' : ''}" data-id="${m.id}">
      <div class="c-top"><span class="c-title">${esc(m.title || '제목 없음')}</span>${m.lock ? ic('lock', 'sm') : ''}<time>${fmtTime(m.updated)}</time></div>
      <div class="c-prev">${m.lock ? '비밀번호로 보호된 메모' : (esc(plain(m.html).slice(0, 100)) || '내용 없음')}</div>
    </button>`).join('')
    : `<div class="none">${q ? '검색 결과가 없어요.' : (filter === 'locked' ? '잠긴 메모가 없어요.' : '아직 메모가 없어요.<br>새 메모를 만들어 보세요.')}</div>`;
}

/* ================= open / leave / create ================= */
function showView(v) { shell.dataset.view = v; }

async function leave() {
  if (dirty) await saveNow();
  const m = cur();
  if (m && !m.lock && !(m.title || '').trim() && !plain(m.html)) {
    syncDel(m); memos = memos.filter(x => x.id !== m.id); store.set(K.memos, memos);
  }
}

async function openMemo(id, focus = false) {
  if (curId && curId !== id) await leave();
  curId = id; undoSnap = null;
  const m = cur(); if (!m) return;
  edEl.hidden = false; emptyEl.hidden = true;
  titleEl.value = m.title || '';
  if (m.lock && !sessions[id]) {
    bodyEl.innerHTML = ''; lockScreen.hidden = false; $('#lsInput').value = ''; $('#lsErr').textContent = '';
  } else {
    lockScreen.hidden = true; bodyEl.innerHTML = sanitize(m.html);
  }
  syncUI(); renderList(); showView('editor');
  if (isMobile() && !(history.state && history.state.ed)) history.pushState({ ed: 1 }, '');
  if (focus && editable()) titleEl.focus();
  if (!lockScreen.hidden && !isMobile()) $('#lsInput').focus();
}

async function showList() {
  await leave(); curId = null;
  edEl.hidden = true; emptyEl.hidden = false;
  renderList(); showView('list');
}

function syncUI() {
  const m = cur(); const ok = editable();
  const bl = $('#btnLock');
  bl.innerHTML = ic(m && m.lock ? 'lock' : 'unlock');
  bl.classList.toggle('on', !!(m && m.lock));
  bl.title = m && m.lock ? '비밀번호 변경·해제' : '비밀번호 설정';
  bl.disabled = !!(m && m.lock && !ok);
  $('#btnShare').disabled = !ok; $('#btnSave').disabled = !ok;
  $$('.chip, .fbtn').forEach(b => b.disabled = !ok);
  updateFoot();
}

function updateFoot() {
  const m = cur(); if (!m) return;
  const len = editable() ? bodyEl.textContent.length : 0;
  $('#foot').textContent = '마지막 수정 · ' + fmtTime(m.updated) + (editable() ? ' · ' + len.toLocaleString() + '자' : '');
}
const setStatus = t => { $('#status').textContent = t; };

async function createMemo() {
  if (curId) await leave();
  const m = { id: uid(), title: '', html: '', updated: Date.now(), lock: null };
  memos.unshift(m); store.set(K.memos, memos);
  curId = null; await openMemo(m.id, true);
  document.body.classList.remove('drawer');
}

async function deleteMemo() {
  const m = cur(); if (!m) return;
  if (!confirm('"' + (m.title || '제목 없음') + '" 메모를 휴지통으로 옮길까요?\n' + TRASH_DAYS + '일 동안 보관되고, 그 뒤에는 자동으로 삭제돼요.')) return;
  if (dirty) await saveNow();                    // 쓰던 내용까지 휴지통에 담기
  clearTimeout(saveTimer); dirty = false;
  trash.unshift({ ...m, trashedAt: Date.now() });
  if (!saveTrash()) { trash.shift(); return; }   // 저장 공간이 없으면 메모를 지우지 않음
  syncDel(m); memos = memos.filter(x => x.id !== m.id); delete sessions[m.id]; store.set(K.memos, memos);
  updateTrashCnt(); if (panel === 'trash') renderTrash();
  curId = null; edEl.hidden = true; emptyEl.hidden = false; renderList(); showView('list');
  if (!isMobile()) { const f = [...memos].sort((a, b) => b.updated - a.updated)[0]; if (f) openMemo(f.id); }
  toast('휴지통으로 옮겼어요');
}

/* ================= save ================= */
function scheduleSave() {
  if (!editable()) return;
  dirty = true; setStatus('저장 중…');
  clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 500);
}
function syncOn() { return !!(window.Sync && window.Sync.state.user); }
function syncPush(m) { if (syncOn()) window.Sync.pushMemo(m); }
function syncDel(m) { if (syncOn() && m.sy) window.Sync.deleteMemo(m.id); }
function touchSnips() {
  snipsAt = Date.now(); store.set(K.snips, snips); store.set(K.snipsAt, snipsAt);
  if (syncOn()) window.Sync.pushSnips(snips, snipsAt);
}
function afterCommit(m) {
  m.updated = Date.now(); delete m.welcome; syncPush(m); store.set(K.memos, memos); renderList(); updateFoot(); setStatus('저장됨');
}
function saveNow() {
  clearTimeout(saveTimer);
  const m = cur();
  if (!m || !editable()) return saveChain;
  dirty = false;
  const title = titleEl.value, html = sanitize(bodyEl.innerHTML);
  if (!m.lock) { m.title = title; m.html = html; afterCommit(m); return saveChain; }
  const s = sessions[m.id];
  saveChain = saveChain.then(async () => {
    const ct = await aesEnc(s.key, enc.encode(JSON.stringify({ h: html })));
    m.title = title; m.lock.d = b64(ct); m.html = ''; afterCommit(m);
  }).catch(e => { console.error(e); toast('저장하지 못했어요'); });

/* ================= shortcuts ================= */
function comboFromEvent(e) {
  const c = e.code || '';
  if (!c || /^(Control|Shift|Alt|Meta|OS)/.test(c)) return null;
  const k = c.startsWith('Key') ? c.slice(3) : c.startsWith('Digit') ? c.slice(5) : c.startsWith('Numpad') ? 'Num' + c.slice(6) : c;
  const m = []; if (e.ctrlKey) m.push('Ctrl'); if (e.altKey) m.push('Alt'); if (e.shiftKey) m.push('Shift'); if (e.metaKey) m.push('Meta');
  return { combo: [...m, k].join('+'), valid: e.altKey || ((e.ctrlKey || e.metaKey) && e.shiftKey) };
}
bodyEl.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && e.code === 'KeyS') { e.preventDefault(); saveNow(); flashSaved(); return; }
  const r = comboFromEvent(e); if (!r || !r.valid) return;
  const s = snips.find(x => x.key === r.combo);
  if (s) { e.preventDefault(); insertText(s.text); }
});

/* ================= clipboard history ================= */
function addClip(text) {
  if (!text || !text.trim()) return;
  text = text.slice(0, 20000);
  const ex = clips.find(c => c.text === text);
  if (ex) { clips = [ex, ...clips.filter(c => c !== ex)]; ex.t = Date.now(); }
  else clips.unshift({ id: uid(), text, t: Date.now(), pin: false });
  let n = 0; clips = clips.filter(c => c.pin || ++n <= MAX_CLIPS);
  store.set(K.clips, clips); renderList(); if (panel === 'clip') renderClips();
}
function onCopyCut() {
  if (suppressClip || mode !== 'app') return;
  const m = cur(), a = document.activeElement;
  if (m && m.lock && (a === bodyEl || a === titleEl)) return;     // 잠긴 메모 내용은 기록하지 않음
  let t = '';
  if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') && typeof a.selectionStart === 'number' && a.type !== 'password') t = a.value.slice(a.selectionStart, a.selectionEnd);
  else t = String(getSelection());
  addClip(t);
}
document.addEventListener('copy', onCopyCut);
document.addEventListener('cut', onCopyCut);

async function copyText(t) {
  suppressClip = true;
  try { await navigator.clipboard.writeText(t); suppressClip = false; return true; }
  catch {
    const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;opacity:0;left:-9999px';
    document.body.appendChild(ta); ta.select(); let ok = false;
    try { ok = document.execCommand('copy'); } catch {}
    ta.remove(); suppressClip = false; return ok;
  }
}

async function buildLink(m, pw) {
  let data = enc.encode(JSON.stringify({ t: titleEl.value, h: sanitize(bodyEl.innerHTML) })), flags = 0;
  const z = await deflate(data); if (z && z.length < data.length) { data = z; flags |= 1; }

  else out = cat([flags], data);

}

    if (curId === d.id) { curId = null; dirty = false; clearTimeout(saveTimer); edEl.hidden = true; emptyEl.hidden = false; showView('list'); }
  } else {

    const nm = { id: d.id, title: d.title || '', html: d.html || '', updated: d.updated, lock: d.lock || null, sy: true };

/* ================= 휴지통 (삭제한 메모 30일 보관) ================= */
const TRASH_KEY = 'memo.v1.trash', TRASH_DAYS = 30, TRASH_TTL = TRASH_DAYS * 86400e3;
let trash = (() => {
  const a = store.get(TRASH_KEY, []);
  return Array.isArray(a) ? a.filter(t => t && t.id).map(t => Number.isFinite(t.trashedAt) ? t : { ...t, trashedAt: Date.now() }) : [];
})();
const trSel = new Set();
const saveTrash = () => store.set(TRASH_KEY, trash);
const updateTrashCnt = () => { $('#cntTrash').textContent = trash.length; };

// 30일이 지난 메모를 지워요. (다른 기기에서 다시 만들어진 같은 메모와 겹치는 항목도 함께 정리)
function trashSweep() {
  const now = Date.now();
  const keep = trash.filter(t => now - t.trashedAt < TRASH_TTL && !memos.some(m => m.id === t.id));
  if (keep.length === trash.length) return false;
  trash = keep; saveTrash(); return true;
}
function sweepNow() { if (trashSweep()) { updateTrashCnt(); if (panel === 'trash') renderTrash(); } }

function renderTrash() {
  trashSweep();
  for (const id of [...trSel]) if (!trash.some(t => t.id === id)) trSel.delete(id);
  updateTrashCnt();
  if (!trash.length) {
    sheetBody.innerHTML = `<p class="hint">삭제한 메모는 ${TRASH_DAYS}일 동안 이곳에 보관돼요.</p><div class="none" style="padding:30px 0">휴지통이 비어 있어요.</div>`;
    return;
  }
  const item = t => {
    const on = trSel.has(t.id), left = TRASH_TTL - (Date.now() - t.trashedAt);
    const when = left < 86400e3 ? '24시간 이내 자동 삭제' : Math.ceil(left / 86400e3) + '일 후 자동 삭제';
    return `
    <div class="tr-item${on ? ' on' : ''}" data-id="${esc(t.id)}">
      <button class="tr-sel" data-act="toggle" aria-pressed="${on}">
        <span class="tr-chk">${ic('check')}</span>
        <span class="tr-main">
          <span class="tr-title"><span class="tr-t">${esc(t.title || '제목 없음')}</span>${t.lock ? ic('lock', 'sm') : ''}</span>
          <span class="tr-prev">${t.lock ? '비밀번호로 보호된 메모' : (esc(plain(t.html).slice(0, 100)) || '내용 없음')}</span>
          <span class="tr-meta">${fmtTime(t.trashedAt)} 삭제 · ${when}</span>
        </span>
      </button>
      <button class="tr-restore" data-act="restore" aria-label="복원" title="복원">${ic('restore')}</button>
    </div>`;
  };
  sheetBody.innerHTML = `
    <p class="hint">삭제한 메모는 ${TRASH_DAYS}일 동안 보관된 뒤 자동으로 완전히 삭제돼요.</p>
    <div class="tr-head">
      <div class="sec"><span id="trCount"></span><button class="link tr-empty" data-act="empty">휴지통 비우기</button></div>
      <div class="tr-bar">
        <button class="tr-all" data-act="selAll" aria-pressed="false"><span class="tr-chk">${ic('check')}</span>전체 선택</button>
        <span class="grow"></span>
        <button class="btn-ghost" data-act="restoreSel" disabled>선택 복원</button>
        <button class="btn-ghost btn-danger" data-act="delSel" disabled>선택 삭제</button>
      </div>
    </div>
    ${trash.map(item).join('')}
    ${syncOn() ? '<p class="note">휴지통은 이 기기에만 보관돼요. 동기화를 켜 두면 다른 기기에서는 삭제한 메모가 바로 사라져요.</p>' : ''}`;
  trBar();
}
function trBar() {
  const cnt = $('#trCount', sheetBody); if (!cnt) return;
  const n = trSel.size, total = trash.length, all = total > 0 && n === total;
  cnt.textContent = n ? `${total}개 중 ${n}개 선택` : `보관 중 ${total}개`;
  const a = $('.tr-all', sheetBody); a.classList.toggle('on', all); a.setAttribute('aria-pressed', all);
  $('[data-act="restoreSel"]', sheetBody).disabled = !n;
  $('[data-act="delSel"]', sheetBody).disabled = !n;
}
function trRow(el) {
  const on = trSel.has(el.dataset.id);
  el.classList.toggle('on', on); $('.tr-sel', el).setAttribute('aria-pressed', on);
}

function restoreFromTrash(ids) {
  const set = new Set(ids), items = trash.filter(t => set.has(t.id));
  if (!items.length) return;
  const now = Date.now();
  // 복원하면 '수정됨'으로 갱신돼요. (동기화 중이면 삭제 기록보다 최신이어야 다시 살아나요)
  const back = items.map((t, i) => { const m = { ...t }; delete m.trashedAt; m.updated = now - i; return m; });
  const prev = memos; memos = [...back, ...memos];
  if (!store.set(K.memos, memos)) { memos = prev; return; }
  trash = trash.filter(t => !set.has(t.id)); ids.forEach(id => trSel.delete(id)); saveTrash();
  back.forEach(m => syncPush(m));
  renderList(); renderTrash();
  toast(back.length === 1 ? '메모를 복원했어요' : back.length + '개 메모를 복원했어요');
}
function purgeFromTrash(ids) {
  const set = new Set(ids), n = trash.filter(t => set.has(t.id)).length;
  if (!n) return;
  if (!confirm('선택한 메모 ' + n + '개를 완전히 삭제할까요?\n삭제하면 되돌릴 수 없어요.')) return;
  trash = trash.filter(t => !set.has(t.id)); ids.forEach(id => trSel.delete(id)); saveTrash();
  renderTrash(); toast(n + '개 메모를 완전히 삭제했어요');
}
function emptyTrash() {
  if (!trash.length) return;
  if (!confirm('휴지통을 비울까요?\n메모 ' + trash.length + '개가 완전히 삭제되고 되돌릴 수 없어요.')) return;
  trash = []; trSel.clear(); saveTrash(); renderTrash(); toast('휴지통을 비웠어요');
}
function trashAct(act, b) {
  if (act === 'toggle') {
    const el = b.closest('.tr-item'), id = el.dataset.id;
    if (trSel.has(id)) trSel.delete(id); else trSel.add(id);
    trRow(el); trBar(); return;
  }
  if (act === 'selAll') {
    if (trSel.size === trash.length) trSel.clear(); else trash.forEach(t => trSel.add(t.id));
    $$('.tr-item', sheetBody).forEach(trRow); trBar(); return;
  }
  if (act === 'restore') restoreFromTrash([b.closest('.tr-item').dataset.id]);
  else if (act === 'restoreSel') restoreFromTrash([...trSel]);
  else if (act === 'delSel') purgeFromTrash([...trSel]);
  else if (act === 'empty') emptyTrash();
}
$('#navTrash').addEventListener('click', () => openPanel('trash'));
setInterval(sweepNow, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) sweepNow(); });
trashSweep(); updateTrashCnt();

/* ================= wiring ================= */

$('#btnNew2').addEventListener('click', createMemo);

}));
$('#search').addEventListener('input', e => { query = e.target.value; renderList(); });
cardsEl.addEventListener('click', e => { const c = e.target.closest('.card'); if (c) openMemo(c.dataset.id); });
addEventListener('popstate', () => {

});
setInterval(() => { if (mode === 'app') { renderList(); updateFoot(); } }, 60000);

/* ================= shared-link viewer ================= */
let shared = null, pending = null;
const vShow = id => ['vLock', 'vNote', 'vBad'].forEach(x => { $('#' + x).hidden = x !== id; });
function renderShared(obj) {
  shared = obj; $('#vTitle').textContent = obj.t || '제목 없음';
  $('#vBody').innerHTML = sanitize(obj.h); vShow('vNote');
}
async function finishShared(flags, data) {
  try {
    if (flags & 1) data = await inflate(data);
    const obj = JSON.parse(dec.decode(data));
    if (typeof obj.h !== 'string') throw new Error('bad');
    renderShared({ t: String(obj.t || ''), h: obj.h });
  } catch (e) {
    $('#vBad').innerHTML = e && e.message === 'nosupport' ? '이 브라우저는 압축된 링크를 열 수 없어요.<br>브라우저를 최신 버전으로 업데이트해 주세요.' : '링크가 올바르지 않거나 일부가 잘렸어요.<br>보낸 사람에게 링크를 다시 받아 보세요.';
    vShow('vBad');
  }
}
async function loadShared(raw) {
  shared = null; pending = null;
  let bytes; try { bytes = unb64(raw); if (!bytes.length) throw 0; } catch { vShow('vBad'); return; }
  const flags = bytes[0];
  if (flags & 2) {
    if (bytes.length < 30) { vShow('vBad'); return; }
    pending = { flags, salt: bytes.slice(1, 17), data: bytes.slice(17) };
    $('#vPw').value = ''; $('#vErr').textContent = ''; vShow('vLock'); if (!isMobile()) $('#vPw').focus();
  } else await finishShared(flags, bytes.slice(1));
}
async function openShared() {
  if (!pending) return;
  const pw = $('#vPw').value; if (!pw) return;
  const btn = $('#vOpen'); btn.disabled = true; btn.textContent = '확인 중…';
  let plainBytes = null;
  try { plainBytes = await aesDec(await deriveKey(pw, pending.salt), pending.data); }
  catch { $('#vErr').textContent = '비밀번호가 맞지 않아요.'; }
  btn.disabled = false; btn.textContent = '열기';
  if (plainBytes) await finishShared(pending.flags & ~2, plainBytes);
}
$('#vOpen').addEventListener('click', openShared);
$('#vPw').addEventListener('keydown', e => { if (e.key === 'Enter') openShared(); });
$('#vSave').addEventListener('click', () => {
  if (!shared) return;
  const m = { id: uid(), title: shared.t, html: sanitize(shared.h), updated: Date.now(), lock: null };
  memos.unshift(m); syncPush(m); store.set(K.memos, memos); toast('내 메모에 저장했어요');
  goApp(m.id);
});
$('#vHome').addEventListener('click', () => goApp());
function goApp(openId) {
  history.replaceState(null, '', location.pathname + location.search);
  route(); if (openId) openMemo(openId);
}

function route() {
  const h = location.hash;
  if (h.startsWith('#m=')) {
    mode = 'view'; $('#app').hidden = true; $('#viewer').hidden = false; closeSheet();
    document.body.classList.remove('drawer'); loadShared(h.slice(3));
  } else {
    mode = 'app'; $('#app').hidden = false; $('#viewer').hidden = true; shared = null; pending = null;
  }
}
addEventListener('hashchange', route);

/* ================= init ================= */
if (!window.crypto || !crypto.subtle) {
  setTimeout(() => toast('이 환경에서는 암호화를 쓸 수 없어요. HTTPS(GitHub Pages) 주소에서 열어주세요.'), 600);
}
renderList();
route();
if (mode === 'app' && !isMobile() && memos.length) openMemo([...memos].sort((a, b) => b.updated - a.updated)[0].id);
})();
</script>

<script type="module">
/* 기기 간 동기화 (Firebase Auth + Firestore)
   firebase-config.js 에 프로젝트 값이 채워져 있을 때만 동작해요. 비어 있으면 아무 통신도 하지 않아요. */
const V = '10.14.1';
const state = { configured: false, user: null, status: 'loading', error: '' };
const api = {};
const notify = () => window.MemoApp && window.MemoApp.onSync();
window.Sync = {
  state,
  pushMemo: m => api.pushMemo && api.pushMemo(m),
  deleteMemo: id => api.deleteMemo && api.deleteMemo(id),
  pushSnips: (items, at) => api.pushSnips && api.pushSnips(items, at),
  signIn: (e, p) => api.signIn(e, p),
  signUp: (e, p) => api.signUp(e, p),
  logout: () => api.logout()
};

(async () => {
  let cfg = {};
  try { cfg = (await import('./firebase-config.js')).default || {}; } catch {}
  if (!cfg.apiKey || !cfg.projectId) { state.status = 'out'; notify(); return; }
  state.configured = true;
  try {
    const base = `https://www.gstatic.com/firebasejs/${V}/`;
    const [A, Au, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
    const fbApp = A.initializeApp(cfg);
    const auth = Au.initializeAuth(fbApp, { persistence: Au.browserLocalPersistence });
    let db;
    try { db = F.initializeFirestore(fbApp, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
    catch { db = F.getFirestore(fbApp); }

    let uid = null, unsubs = [];
    const fail = e => { state.status = 'error'; state.error = (e && e.code) || String(e); notify(); };
    const memoRef = id => F.doc(db, 'users', uid, 'memos', id);
    const snipRef = () => F.doc(db, 'users', uid, 'meta', 'snips');

    api.pushMemo = m => {
      if (!uid) return; m.sy = true;
      F.setDoc(memoRef(m.id), { title: m.title || '', html: m.lock ? '' : (m.html || ''), lock: m.lock || null, updated: m.updated, deleted: false }).catch(fail);
    };
    api.deleteMemo = id => {
      if (!uid) return;
      F.setDoc(memoRef(id), { title: '', html: '', lock: null, updated: Date.now(), deleted: true }).catch(fail);
    };
    api.pushSnips = (items, at) => { if (uid) F.setDoc(snipRef(), { items, updated: at }).catch(fail); };
    api.signIn = (e, p) => Au.signInWithEmailAndPassword(auth, e, p);
    api.signUp = (e, p) => Au.createUserWithEmailAndPassword(auth, e, p);
    api.logout = () => Au.signOut(auth);

    function start(user) {
      uid = user.uid; let first = true, firstSnip = true;
      state.status = 'syncing'; notify();
      unsubs.push(F.onSnapshot(F.collection(db, 'users', uid, 'memos'), { includeMetadataChanges: true }, snap => {
        const remote = new Map();
        snap.docs.forEach(d => { const x = d.data(); x.id = d.id; remote.set(d.id, x); });
        snap.docChanges().forEach(ch => { const x = remote.get(ch.doc.id); if (x) window.MemoApp.applyRemote(x); });
        if (first && !snap.metadata.fromCache) {                       // 서버와 연결된 뒤 한 번: 이 기기에만 있거나 더 최신인 메모 올리기
          first = false;
          window.MemoApp.getMemos().slice().forEach(m => {
            if (m.welcome) return;
            const r = remote.get(m.id);
            if (!r || m.updated > r.updated) api.pushMemo(m);
          });
        }
        state.status = !snap.metadata.fromCache ? 'synced' : (first ? 'syncing' : 'offline');
        notify();
      }, fail));
      unsubs.push(F.onSnapshot(snipRef(), { includeMetadataChanges: true }, s => {
        const M = window.MemoApp, local = M.getSnipsAt();
        if (s.exists()) {
          const d = s.data();
          if (d.updated > local) M.applySnips(d.items || [], d.updated);
          else if (d.updated < local && !s.metadata.fromCache) api.pushSnips(M.getSnips(), local);
        } else if (!s.metadata.fromCache && firstSnip) api.pushSnips(M.getSnips(), local || 1);
        if (!s.metadata.fromCache) firstSnip = false;
      }, fail));
    }

    Au.onAuthStateChanged(auth, user => {
      unsubs.forEach(u => u()); unsubs = []; uid = null; state.user = user || null;
      if (user) start(user); else { state.status = 'out'; notify(); }
    });
  } catch (e) { state.status = 'fail'; state.error = String((e && e.message) || e); notify(); }
})();
</script>
